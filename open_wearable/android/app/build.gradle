plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Creates a version code based on the unix timestamp that increases every 60 seconds, so that 1 isn't default anymore
// Based on: https://stackoverflow.com/a/38643838
// Code Limit for Google Play: 2100000000
// Works long enough for us:  2100000000 / (60*24 * 365) = 3995.433789954338 years
def customVersionCode = (int)(((new Date().getTime() / 1000) - 1749360556) / 60)

android {
    namespace = "edu.kit.teco.openWearable"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "edu.kit.teco.openWearable"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = customVersionCode.toInteger()
        versionName = flutter.versionName
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments["clearPackageData"] = "true"
    }

    buildTypes {
        debug {
            // Patrol runs debug builds. Give that build its own Android identity
            // so it can live beside the user's normal OpenWearables app and so
            // test-data cleanup never touches the production installation.
            applicationIdSuffix = ".patrol"
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }
}

flutter {
    source = "../.."
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.5.1"
}
